name: FreeType 2.13.3 Source Export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch pinned source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git freetype
          cd freetype
          COMMIT=$(git rev-parse HEAD)
          test -f include/ft2build.h
          test -f LICENSE.TXT
          printf 'tag=VER-2-13-3\nversion=2.13.3\ncommit=%s\nrepository=https://github.com/freetype/freetype.git\nlicense=FTL-or-GPL-2.0-only\n' "$COMMIT" > ../FREETYPE_2_13_3_PROVENANCE.txt
          cd ..
          rm -rf freetype/.git
          tar -cJf freetype-2.13.3-source.tar.xz freetype FREETYPE_2_13_3_PROVENANCE.txt
          sha256sum freetype-2.13.3-source.tar.xz > freetype-2.13.3-source.tar.xz.sha256
          cat FREETYPE_2_13_3_PROVENANCE.txt
          cat freetype-2.13.3-source.tar.xz.sha256

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: freetype-2.13.3-source
          path: |
            freetype-2.13.3-source.tar.xz
            freetype-2.13.3-source.tar.xz.sha256
            FREETYPE_2_13_3_PROVENANCE.txt
          compression-level: 0
          retention-days: 7
