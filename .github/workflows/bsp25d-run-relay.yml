name: BSP25D Run Relay

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  locate-toolchain-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Locate latest offline-toolchain run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          gh run list --repo "$GH_REPO" --workflow bsp25d-offline-toolchain.yml --branch main --limit 10 \
            --json databaseId,headSha,status,conclusion,createdAt,url \
            | tee toolchain-runs.json
          RUN_ID=$(jq -r '.[0].databaseId // empty' toolchain-runs.json)
          test -n "$RUN_ID"
          echo "BSP25D_TOOLCHAIN_RUN_ID=$RUN_ID"
          gh run view "$RUN_ID" --repo "$GH_REPO" --json databaseId,status,conclusion,url,jobs | tee toolchain-run.json
          gh run view "$RUN_ID" --repo "$GH_REPO" --log-failed || true
