name: BSP25D Offline Toolchain Fast Export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Host prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers glslang-tools spirv-tools pax-utils zstd xz-utils jq file unzip

      - name: Download and verify pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p dl stage
          gh release download 20260616 -R mstorsjo/llvm-mingw -p 'llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz' -D dl
          gh release download 11.15 -R Kron4ek/Wine-Builds -p 'wine-11.15-staging-amd64-wow64.tar.xz' -D dl
          gh release download v3.0.1 -R HansKristian-Work/vkd3d-proton -p 'vkd3d-proton-3.0.1.tar.zst' -D dl
          gh release download v1.9.2607 -R microsoft/DirectXShaderCompiler -p 'dxc_2026_07_29.zip' -D dl
          echo '534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda  dl/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz' | sha256sum -c -
          echo 'bf1d9f386fc84f4c2224dd17c45bffecf0bdceb88a02b5f5fcbf740134101613  dl/wine-11.15-staging-amd64-wow64.tar.xz' | sha256sum -c -
          echo '3cf2315522af5e43605ef6d3c41dad91387040bf97199934f3f7ab76caaa2f0c  dl/vkd3d-proton-3.0.1.tar.zst' | sha256sum -c -
          echo 'a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241  dl/dxc_2026_07_29.zip' | sha256sum -c -
          sha256sum dl/* > stage/DOWNLOAD_SHA256.txt

      - name: Extract tools
        run: |
          set -euxo pipefail
          mkdir -p stage/mingw stage/wine stage/vkd3d stage/dxc/bin stage/dxc-win
          tar -xJf dl/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz -C stage/mingw --strip-components=1
          tar -xJf dl/wine-11.15-staging-amd64-wow64.tar.xz -C stage/wine --strip-components=1
          tar --zstd -xf dl/vkd3d-proton-3.0.1.tar.zst -C stage/vkd3d --strip-components=1
          unzip -q dl/dxc_2026_07_29.zip -d stage/dxc-win
          DXC_EXE=$(find stage/dxc-win -type f -iname dxc.exe | grep -Ei 'x64|amd64' | head -1 || true)
          test -n "$DXC_EXE"
          printf '%s\n' "$DXC_EXE" > stage/dxc/DXC_EXE.relative
          cat > stage/dxc/bin/dxc <<'SH'
          #!/usr/bin/env bash
          D="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          R="$(cd "$D/../.." && pwd)"
          X="$(cat "$R/dxc/DXC_EXE.relative")"
          exec env WINEDEBUG=-all "$R/wine/bin/wine" "$R/${X#stage/}" "$@"
          SH
          chmod +x stage/dxc/bin/dxc

      - name: Stage Mesa and runtime dependencies
        run: |
          set -euxo pipefail
          HR="$PWD/stage/host-runtime"; WD="$PWD/stage/wine-deps"
          mkdir -p "$HR/bin" "$HR/lib" "$HR/icd" "$HR/layers" "$WD/lib"
          copydeps(){ f="$1"; lddtree -l "$f" 2>/dev/null | while read -r d; do test -f "$d" && cp -L -n "$d" "$2/" || true; done; }
          LVP=$(find /usr/lib -type f -name libvulkan_lvp.so -print -quit); test -n "$LVP"
          cp -L "$LVP" "$HR/lib/libvulkan_lvp.so"; copydeps "$LVP" "$HR/lib"
          for b in /usr/bin/vulkaninfo /usr/bin/glslangValidator /usr/bin/spirv-val; do cp -L "$b" "$HR/bin/"; copydeps "$b" "$HR/lib"; done
          cp -L /usr/lib/x86_64-linux-gnu/libvulkan.so.1 "$HR/lib/"; copydeps /usr/lib/x86_64-linux-gnu/libvulkan.so.1 "$HR/lib"
          cat > "$HR/icd/lvp_icd.json" <<'JSON'
          {"file_format_version":"1.0.0","ICD":{"library_path":"libvulkan_lvp.so","api_version":"1.4.0"}}
          JSON
          VJSON=$(find /usr/share/vulkan/explicit_layer.d -type f -iname '*validation*.json' -print -quit || true)
          if [ -n "$VJSON" ]; then cp "$VJSON" "$HR/layers/"; fi
          find stage/wine -type f -print0 | while IFS= read -r -d '' f; do if file "$f" | grep -q 'ELF '; then copydeps "$f" "$WD/lib"; fi; done

      - name: Create relocatable environment
        run: |
          set -euxo pipefail
          cat > stage/env.sh <<'SH'
          #!/usr/bin/env bash
          BSP25D_TOOLCHAIN_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"; export BSP25D_TOOLCHAIN_ROOT
          export LLVM_MINGW_ROOT="$BSP25D_TOOLCHAIN_ROOT/mingw"
          export WINE_ROOT="$BSP25D_TOOLCHAIN_ROOT/wine"
          export VKD3D_PROTON_ROOT="$BSP25D_TOOLCHAIN_ROOT/vkd3d"
          export DXC_ROOT="$BSP25D_TOOLCHAIN_ROOT/dxc"
          export HOST_RUNTIME_ROOT="$BSP25D_TOOLCHAIN_ROOT/host-runtime"
          export PATH="$LLVM_MINGW_ROOT/bin:$WINE_ROOT/bin:$DXC_ROOT/bin:$HOST_RUNTIME_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$BSP25D_TOOLCHAIN_ROOT/wine-deps/lib:$HOST_RUNTIME_ROOT/lib:${LD_LIBRARY_PATH:-}"
          export VK_ICD_FILENAMES="$HOST_RUNTIME_ROOT/icd/lvp_icd.json"
          export VK_DRIVER_FILES="$VK_ICD_FILENAMES"
          SH
          chmod +x stage/env.sh

      - name: Core validation
        continue-on-error: true
        run: |
          set +e
          source stage/env.sh; mkdir -p stage/logs
          x86_64-w64-mingw32-clang++ --version >stage/logs/mingw.txt 2>&1; A=$?
          wine --version >stage/logs/wine.txt 2>&1; B=$?
          WINEPREFIX="$PWD/stage/dxc-prefix" dxc --version >stage/logs/dxc.txt 2>&1; C=$?
          vulkaninfo --summary >stage/logs/vulkaninfo.txt 2>&1; D=$?
          glslangValidator --version >stage/logs/glslang.txt 2>&1; E=$?
          spirv-val --version >stage/logs/spirv-val.txt 2>&1; F=$?
          cat >/tmp/hello.cpp <<'CPP'
          #include <cstdio>
          int main(){std::puts("BSP25D_MINGW_WINE_PASS");return 0;}
          CPP
          x86_64-w64-mingw32-clang++ -O2 -static /tmp/hello.cpp -o stage/hello.exe >stage/logs/hello_build.txt 2>&1; G=$?
          WINEPREFIX="$PWD/stage/hello-prefix" timeout 90s env WINEDEBUG=-all wine stage/hello.exe >stage/logs/wine_hello.txt 2>&1; H=$?
          printf 'mingw=%s\nwine=%s\ndxc=%s\nvulkaninfo=%s\nglslang=%s\nspirv_val=%s\nhello_build=%s\nwine_hello=%s\n' "$A" "$B" "$C" "$D" "$E" "$F" "$G" "$H" >stage/logs/core_status.txt
          if [ "$A$B$C$D$E$F$G$H" = 00000000 ] && grep -Eiq 'llvmpipe|lavapipe' stage/logs/vulkaninfo.txt && grep -q BSP25D_MINGW_WINE_PASS stage/logs/wine_hello.txt; then echo PASS >stage/logs/core_result.txt; exit 0; fi
          echo OPEN >stage/logs/core_result.txt; exit 1

      - name: D3D12 vkd3d Lavapipe validation
        continue-on-error: true
        run: |
          set +e
          source stage/env.sh; mkdir -p stage/logs
          export WINEPREFIX="$PWD/stage/d3d12-prefix"; rm -rf "$WINEPREFIX"
          timeout 90s env WINEDEBUG=-all wineboot -u >stage/logs/d3d12_wineboot.txt 2>&1; A=$?
          SYS="$WINEPREFIX/drive_c/windows/system32"; mkdir -p "$SYS"
          cp -f "$VKD3D_PROTON_ROOT/x64/d3d12.dll" "$SYS/d3d12.dll"
          cp -f "$VKD3D_PROTON_ROOT/x64/d3d12core.dll" "$SYS/d3d12core.dll"
          export WINEDLLOVERRIDES='d3d12,d3d12core=n,b;mscoree,mshtml='
          cat >/tmp/d3d12.cpp <<'CPP'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <d3d12.h>
          #include <cstdio>
          int main(){ID3D12Device*d=nullptr;HRESULT h=D3D12CreateDevice(nullptr,D3D_FEATURE_LEVEL_11_0,__uuidof(ID3D12Device),(void**)&d);if(FAILED(h)||!d){printf("D3D12_FAIL hr=0x%08lx\n",(unsigned long)h);return 3;}printf("BSP25D_D3D12_WINE_LAVAPIPE_PASS nodes=%u\n",(unsigned)d->GetNodeCount());d->Release();return 0;}
          CPP
          x86_64-w64-mingw32-clang++ -std=c++20 -O2 /tmp/d3d12.cpp -o stage/d3d12_probe.exe -ld3d12 -ldxgi -lole32 -luuid >stage/logs/d3d12_build.txt 2>&1; B=$?
          if [ "$B" -eq 0 ]; then timeout 120s env WINEDEBUG=+loaddll,+module wine stage/d3d12_probe.exe >stage/logs/d3d12_debug.txt 2>&1; C=$?; else C=99; fi
          grep -E 'BSP25D_D3D12|D3D12_FAIL|err:|failed|c0000135|vkd3d' stage/logs/d3d12_debug.txt 2>/dev/null | tail -300 >stage/logs/d3d12_focus.txt || true
          printf 'wineboot=%s\nbuild=%s\nrun=%s\n' "$A" "$B" "$C" >stage/logs/d3d12_status.txt
          if [ "$A$B$C" = 000 ] && grep -q BSP25D_D3D12_WINE_LAVAPIPE_PASS stage/logs/d3d12_debug.txt; then echo PASS >stage/logs/d3d12_result.txt; exit 0; fi
          echo OPEN >stage/logs/d3d12_result.txt; exit 1

      - name: Package always
        if: always()
        run: |
          set -euxo pipefail
          rm -rf stage/*-prefix stage/dxc-prefix stage/hello-prefix stage/d3d12-prefix
          CORE=$(cat stage/logs/core_result.txt 2>/dev/null || echo NOT_RUN)
          D3D=$(cat stage/logs/d3d12_result.txt 2>/dev/null || echo NOT_RUN)
          cat >stage/manifest.json <<EOF
          {"schema":"bsp25d.offline_toolchain.v3","llvm_mingw":"20260616-ucrt","wine":"11.15-staging-wow64","vkd3d_proton":"3.0.1","dxc":"1.9.2607-windows-via-wine","mesa":"25.2.8-lavapipe","core_validation":"$CORE","d3d12_vkd3d_lavapipe":"$D3D"}
          EOF
          (cd stage && find . -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum >MANIFEST_SHA256.txt)
          tar --zstd -cf bsp25d-offline-toolchain.tar.zst -C stage .
          sha256sum bsp25d-offline-toolchain.tar.zst >bsp25d-offline-toolchain.tar.zst.sha256
          ls -lh bsp25d-offline-toolchain.tar.zst

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsp25d-offline-toolchain-fast-linux-x64
          path: |
            bsp25d-offline-toolchain.tar.zst
            bsp25d-offline-toolchain.tar.zst.sha256
          compression-level: 0
          retention-days: 7
