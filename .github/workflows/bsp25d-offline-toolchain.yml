name: BSP25D Offline Toolchain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare host packages
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers \
            glslang-tools spirv-tools pax-utils zstd xz-utils jq cmake ninja-build file unzip

      - name: Download pinned portable toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p downloads stage
          gh release download 20260616 -R mstorsjo/llvm-mingw \
            -p 'llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz' -D downloads
          gh release download 11.15 -R Kron4ek/Wine-Builds \
            -p 'wine-11.15-staging-amd64-wow64.tar.xz' -D downloads
          gh release download v3.0.1 -R HansKristian-Work/vkd3d-proton \
            -p 'vkd3d-proton-3.0.1.tar.zst' -D downloads
          gh release download v1.9.2607 -R microsoft/DirectXShaderCompiler \
            -p 'dxc_2026_07_29.zip' -D downloads
          printf '%s  %s\n' \
            '534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda' \
            'downloads/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz' | sha256sum -c -
          printf '%s  %s\n' \
            'bf1d9f386fc84f4c2224dd17c45bffecf0bdceb88a02b5f5fcbf740134101613' \
            'downloads/wine-11.15-staging-amd64-wow64.tar.xz' | sha256sum -c -
          printf '%s  %s\n' \
            '3cf2315522af5e43605ef6d3c41dad91387040bf97199934f3f7ab76caaa2f0c' \
            'downloads/vkd3d-proton-3.0.1.tar.zst' | sha256sum -c -
          printf '%s  %s\n' \
            'a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241' \
            'downloads/dxc_2026_07_29.zip' | sha256sum -c -
          sha256sum downloads/* | tee downloads/SHA256SUMS.txt

      - name: Extract portable components
        run: |
          set -euxo pipefail
          mkdir -p stage/mingw stage/wine stage/vkd3d stage/dxc/bin stage/dxc-win
          tar -xJf downloads/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz -C stage/mingw --strip-components=1
          tar -xJf downloads/wine-11.15-staging-amd64-wow64.tar.xz -C stage/wine --strip-components=1
          tar --zstd -xf downloads/vkd3d-proton-3.0.1.tar.zst -C stage/vkd3d --strip-components=1
          unzip -q downloads/dxc_2026_07_29.zip -d stage/dxc-win
          test -f stage/dxc-win/bin/x64/dxc.exe
          cat > stage/dxc/bin/dxc <<'SH'
          #!/usr/bin/env bash
          D="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          R="$(cd "$D/../.." && pwd)"
          exec env WINEDEBUG=-all "$R/wine/bin/wine" "$R/dxc-win/bin/x64/dxc.exe" "$@"
          SH
          chmod +x stage/dxc/bin/dxc

      - name: Stage relocatable Mesa and shader runtime
        run: |
          set -euxo pipefail
          ROOT="$PWD/stage/host-runtime"
          mkdir -p "$ROOT/bin" "$ROOT/lib" "$ROOT/icd" "$ROOT/layers"
          copy_elf_deps() {
            local f="$1"
            test -e "$f" || return 0
            lddtree -l "$f" 2>/dev/null | while read -r dep; do
              test -f "$dep" && cp -L -n "$dep" "$ROOT/lib/" || true
            done
          }
          LVP=$(find /usr/lib -type f -name 'libvulkan_lvp.so' -print -quit)
          test -n "$LVP"
          cp -L "$LVP" "$ROOT/lib/libvulkan_lvp.so"
          copy_elf_deps "$LVP"
          for b in /usr/bin/vulkaninfo /usr/bin/glslangValidator /usr/bin/spirv-val; do
            cp -L "$b" "$ROOT/bin/"
            copy_elf_deps "$b"
          done
          cp -L /usr/lib/x86_64-linux-gnu/libvulkan.so.1 "$ROOT/lib/"
          copy_elf_deps /usr/lib/x86_64-linux-gnu/libvulkan.so.1
          cat > "$ROOT/icd/lvp_icd.json" <<'JSON'
          {
            "file_format_version": "1.0.0",
            "ICD": { "library_path": "libvulkan_lvp.so", "api_version": "1.4.0" }
          }
          JSON
          VJSON=$(find /usr/share/vulkan/explicit_layer.d -type f -iname '*validation*.json' -print -quit || true)
          if [ -n "$VJSON" ]; then
            cp "$VJSON" "$ROOT/layers/"
            VSO=$(jq -r '.layer.library_path // empty' "$VJSON")
            if [ -n "$VSO" ]; then
              VPATH=$(find /usr/lib -type f -name "$(basename "$VSO")" -print -quit || true)
              if [ -n "$VPATH" ]; then
                cp -L "$VPATH" "$ROOT/lib/"
                copy_elf_deps "$VPATH"
              fi
            fi
          fi

      - name: Stage Wine ELF dependencies
        run: |
          set -euxo pipefail
          ROOT="$PWD/stage/wine-deps"
          mkdir -p "$ROOT/lib"
          find stage/wine -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'ELF '; then
              lddtree -l "$f" 2>/dev/null | while read -r dep; do
                test -f "$dep" && cp -L -n "$dep" "$ROOT/lib/" || true
              done
            fi
          done

      - name: Create environment wrapper
        run: |
          set -euxo pipefail
          cat > stage/env.sh <<'SH'
          #!/usr/bin/env bash
          BSP25D_TOOLCHAIN_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export BSP25D_TOOLCHAIN_ROOT
          export LLVM_MINGW_ROOT="$BSP25D_TOOLCHAIN_ROOT/mingw"
          export WINE_ROOT="$BSP25D_TOOLCHAIN_ROOT/wine"
          export VKD3D_PROTON_ROOT="$BSP25D_TOOLCHAIN_ROOT/vkd3d"
          export DXC_ROOT="$BSP25D_TOOLCHAIN_ROOT/dxc"
          export HOST_RUNTIME_ROOT="$BSP25D_TOOLCHAIN_ROOT/host-runtime"
          export PATH="$LLVM_MINGW_ROOT/bin:$WINE_ROOT/bin:$DXC_ROOT/bin:$HOST_RUNTIME_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$BSP25D_TOOLCHAIN_ROOT/wine-deps/lib:$HOST_RUNTIME_ROOT/lib:${LD_LIBRARY_PATH:-}"
          export VK_ICD_FILENAMES="$HOST_RUNTIME_ROOT/icd/lvp_icd.json"
          export VK_DRIVER_FILES="$VK_ICD_FILENAMES"
          if compgen -G "$HOST_RUNTIME_ROOT/layers/*.json" >/dev/null; then export VK_LAYER_PATH="$HOST_RUNTIME_ROOT/layers"; fi
          SH
          chmod +x stage/env.sh

      - name: Verify portable MinGW Wine Lavapipe shader tools
        run: |
          set -euxo pipefail
          source stage/env.sh
          mkdir -p stage/logs
          x86_64-w64-mingw32-clang++ --version | head -2 | tee stage/logs/mingw.txt
          wine --version | tee stage/logs/wine.txt
          dxc --version | head -4 | tee stage/logs/dxc.txt
          glslangValidator --version | head -4 | tee stage/logs/glslang.txt
          spirv-val --version | head -2 | tee stage/logs/spirv-val.txt
          vulkaninfo --summary | tee stage/logs/vulkaninfo.txt
          grep -Ei 'llvmpipe|lavapipe' stage/logs/vulkaninfo.txt
          cat > /tmp/hello.cpp <<'CPP'
          #include <cstdio>
          int main(){ std::puts("BSP25D_MINGW_WINE_PASS"); return 0; }
          CPP
          x86_64-w64-mingw32-clang++ -O2 -static /tmp/hello.cpp -o stage/hello.exe
          timeout 90s env WINEDEBUG=-all wine stage/hello.exe | tee stage/logs/wine_hello.txt
          grep BSP25D_MINGW_WINE_PASS stage/logs/wine_hello.txt

      - name: Probe D3D12 through Wine vkd3d on Lavapipe
        id: d3d12probe
        continue-on-error: true
        run: |
          set +e
          source stage/env.sh
          mkdir -p stage/logs
          export WINEPREFIX="$PWD/stage/wineprefix-d3d12"
          rm -rf "$WINEPREFIX"
          timeout 90s env WINEDEBUG=-all wineboot -u >stage/logs/wineboot.txt 2>&1
          BOOT=$?
          SYS64="$WINEPREFIX/drive_c/windows/system32"
          mkdir -p "$SYS64"
          cp -f "$VKD3D_PROTON_ROOT/x64/d3d12.dll" "$SYS64/d3d12.dll"
          cp -f "$VKD3D_PROTON_ROOT/x64/d3d12core.dll" "$SYS64/d3d12core.dll"
          export WINEDLLOVERRIDES="d3d12,d3d12core=n,b;mscoree,mshtml="
          cat > /tmp/d3d12_probe.cpp <<'CPP'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <d3d12.h>
          #include <cstdio>
          int main(){
            ID3D12Device* dev=nullptr;
            HRESULT hr=D3D12CreateDevice(nullptr,D3D_FEATURE_LEVEL_11_0,__uuidof(ID3D12Device),(void**)&dev);
            if(FAILED(hr)||!dev){ std::printf("D3D12_FAIL hr=0x%08lx\n",(unsigned long)hr); return 3; }
            D3D12_FEATURE_DATA_D3D12_OPTIONS opts{};
            HRESULT ohr=dev->CheckFeatureSupport(D3D12_FEATURE_D3D12_OPTIONS,&opts,sizeof(opts));
            std::printf("BSP25D_D3D12_WINE_LAVAPIPE_PASS nodes=%u opts_hr=0x%08lx\n",(unsigned)dev->GetNodeCount(),(unsigned long)ohr);
            dev->Release(); return 0;
          }
          CPP
          x86_64-w64-mingw32-clang++ -std=c++20 -O2 /tmp/d3d12_probe.cpp -o stage/d3d12_probe.exe -ld3d12 -ldxgi -lole32 -luuid >stage/logs/d3d12_build.txt 2>&1
          BUILD=$?
          if [ "$BUILD" -eq 0 ]; then
            timeout 120s env WINEDEBUG=+loaddll,+module wine stage/d3d12_probe.exe >stage/logs/d3d12_probe_debug.txt 2>&1
            RUN=$?
            grep -E 'BSP25D_D3D12|D3D12_FAIL|err:|failed|c0000135|vkd3d' stage/logs/d3d12_probe_debug.txt | tail -200 > stage/logs/d3d12_probe_focus.txt || true
          else
            RUN=99
          fi
          printf 'wineboot_exit=%s\nbuild_exit=%s\nrun_exit=%s\n' "$BOOT" "$BUILD" "$RUN" | tee stage/logs/d3d12_status.txt
          if [ "$BOOT" -eq 0 ] && [ "$BUILD" -eq 0 ] && [ "$RUN" -eq 0 ] && grep -q BSP25D_D3D12_WINE_LAVAPIPE_PASS stage/logs/d3d12_probe_debug.txt; then
            echo PASS > stage/logs/d3d12_result.txt
            exit 0
          fi
          echo OPEN > stage/logs/d3d12_result.txt
          exit 1

      - name: Pack offline cache
        if: always()
        run: |
          set -euxo pipefail
          rm -rf stage/wineprefix stage/wineprefix-d3d12
          D3D12_RESULT=$(cat stage/logs/d3d12_result.txt 2>/dev/null || echo NOT_RUN)
          cat > stage/manifest.json <<EOF
          {"schema":"bsp25d.offline_toolchain.v2","runner":"ubuntu-24.04","llvm_mingw":"20260616-ucrt","wine":"11.15-staging-amd64-wow64","vkd3d_proton":"3.0.1","dxc":"v1.9.2607-windows-via-wine","lavapipe":"mesa-25.2.8-ubuntu24.04","validated":{"mingw":true,"wine":true,"lavapipe":true,"d3d12_vkd3d":"${D3D12_RESULT}"}}
          EOF
          (cd stage && sha256sum hello.exe d3d12_probe.exe 2>/dev/null > TOOLCHAIN_PROOFS.sha256 || true)
          (cd stage && find . -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt)
          tar -cJf bsp25d-offline-toolchain.tar.xz -C stage .
          sha256sum bsp25d-offline-toolchain.tar.xz > bsp25d-offline-toolchain.tar.xz.sha256
          ls -lh bsp25d-offline-toolchain.tar.xz

      - name: Upload offline cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsp25d-offline-toolchain-linux-x64
          path: |
            bsp25d-offline-toolchain.tar.xz
            bsp25d-offline-toolchain.tar.xz.sha256
          compression-level: 0
          retention-days: 7
