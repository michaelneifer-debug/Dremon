name: BSP25D Offline Toolchain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare host packages
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers \
            glslang-tools spirv-tools pax-utils zstd xz-utils jq cmake ninja-build xvfb

      - name: Download pinned portable toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p downloads stage
          gh release download 20260616 -R mstorsjo/llvm-mingw \
            -p 'llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz' -D downloads
          gh release download 11.13 -R Kron4ek/Wine-Builds \
            -p 'wine-11.13-staging-amd64-wow64.tar.xz' -D downloads
          gh release download v3.0.1 -R HansKristian-Work/vkd3d-proton \
            -p 'vkd3d-proton-3.0.1.tar.zst' -D downloads
          DXC_TAG='v1.9.2602.24'
          DXC_ASSET=$(gh api "repos/microsoft/DirectXShaderCompiler/releases/tags/${DXC_TAG}" \
            --jq '.assets[].name' | grep -E 'linux.*x86_64.*tar.gz$' | head -1)
          test -n "$DXC_ASSET"
          gh release download "$DXC_TAG" -R microsoft/DirectXShaderCompiler -p "$DXC_ASSET" -D downloads
          sha256sum downloads/* | tee downloads/SHA256SUMS.txt

      - name: Extract portable components
        run: |
          set -euxo pipefail
          mkdir -p stage/mingw stage/wine stage/vkd3d stage/dxc
          tar -xJf downloads/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz -C stage/mingw --strip-components=1
          tar -xJf downloads/wine-11.13-staging-amd64-wow64.tar.xz -C stage/wine --strip-components=1
          tar --zstd -xf downloads/vkd3d-proton-3.0.1.tar.zst -C stage/vkd3d --strip-components=1
          DXC_ARCHIVE=$(find downloads -maxdepth 1 -type f -name '*linux*x86_64*.tar.gz' | head -1)
          tar -xzf "$DXC_ARCHIVE" -C stage/dxc

      - name: Stage relocatable Mesa and shader runtime
        run: |
          set -euxo pipefail
          ROOT="$PWD/stage/host-runtime"
          mkdir -p "$ROOT/bin" "$ROOT/lib" "$ROOT/icd" "$ROOT/layers"
          copy_elf_deps() {
            local f="$1"
            test -e "$f" || return 0
            lddtree -l "$f" 2>/dev/null | while read -r dep; do
              test -f "$dep" && cp -L -n "$dep" "$ROOT/lib/" || true
            done
          }
          LVP=$(find /usr/lib -type f -name 'libvulkan_lvp.so' -print -quit)
          test -n "$LVP"
          cp -L "$LVP" "$ROOT/lib/libvulkan_lvp.so"
          copy_elf_deps "$LVP"
          for b in /usr/bin/vulkaninfo /usr/bin/glslangValidator /usr/bin/spirv-val; do
            cp -L "$b" "$ROOT/bin/"
            copy_elf_deps "$b"
          done
          cp -L /usr/lib/x86_64-linux-gnu/libvulkan.so.1 "$ROOT/lib/" || true
          copy_elf_deps /usr/lib/x86_64-linux-gnu/libvulkan.so.1
          cat > "$ROOT/icd/lvp_icd.json" <<'JSON'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "libvulkan_lvp.so",
              "api_version": "1.4.0"
            }
          }
          JSON
          VJSON=$(find /usr/share/vulkan/explicit_layer.d -type f -iname '*validation*.json' -print -quit || true)
          if [ -n "$VJSON" ]; then
            cp "$VJSON" "$ROOT/layers/"
            VSO=$(jq -r '.layer.library_path // empty' "$VJSON")
            if [ -n "$VSO" ]; then
              VPATH=$(find /usr/lib -type f -name "$(basename "$VSO")" -print -quit || true)
              if [ -n "$VPATH" ]; then
                cp -L "$VPATH" "$ROOT/lib/"
                copy_elf_deps "$VPATH"
              fi
            fi
          fi

      - name: Stage Wine ELF dependencies
        run: |
          set -euxo pipefail
          ROOT="$PWD/stage/wine-deps"
          mkdir -p "$ROOT/lib"
          find stage/wine -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'ELF '; then
              lddtree -l "$f" 2>/dev/null | while read -r dep; do
                test -f "$dep" && cp -L -n "$dep" "$ROOT/lib/" || true
              done
            fi
          done

      - name: Create environment wrapper
        run: |
          set -euxo pipefail
          cat > stage/env.sh <<'SH'
          #!/usr/bin/env bash
          BSP25D_TOOLCHAIN_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export BSP25D_TOOLCHAIN_ROOT
          export LLVM_MINGW_ROOT="$BSP25D_TOOLCHAIN_ROOT/mingw"
          export WINE_ROOT="$BSP25D_TOOLCHAIN_ROOT/wine"
          export VKD3D_PROTON_ROOT="$BSP25D_TOOLCHAIN_ROOT/vkd3d"
          export DXC_ROOT="$BSP25D_TOOLCHAIN_ROOT/dxc"
          export HOST_RUNTIME_ROOT="$BSP25D_TOOLCHAIN_ROOT/host-runtime"
          export PATH="$LLVM_MINGW_ROOT/bin:$WINE_ROOT/bin:$DXC_ROOT/bin:$HOST_RUNTIME_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$BSP25D_TOOLCHAIN_ROOT/wine-deps/lib:$HOST_RUNTIME_ROOT/lib:$DXC_ROOT/lib:${LD_LIBRARY_PATH:-}"
          export VK_ICD_FILENAMES="$HOST_RUNTIME_ROOT/icd/lvp_icd.json"
          export VK_DRIVER_FILES="$VK_ICD_FILENAMES"
          if compgen -G "$HOST_RUNTIME_ROOT/layers/*.json" >/dev/null; then
            export VK_LAYER_PATH="$HOST_RUNTIME_ROOT/layers"
          fi
          SH
          chmod +x stage/env.sh

      - name: Verify portable MinGW Wine Lavapipe shader tools
        run: |
          set -euxo pipefail
          source stage/env.sh
          x86_64-w64-mingw32-clang++ --version | head -2
          wine --version
          dxc --version | head -4
          glslangValidator --version | head -4
          spirv-val --version | head -2
          vulkaninfo --summary | tee stage/vulkaninfo.txt
          grep -Ei 'llvmpipe|lavapipe' stage/vulkaninfo.txt
          cat > /tmp/hello.cpp <<'CPP'
          #include <cstdio>
          int main(){ std::puts("BSP25D_MINGW_WINE_PASS"); return 0; }
          CPP
          x86_64-w64-mingw32-clang++ -O2 -static -static-libgcc -static-libstdc++ /tmp/hello.cpp -o stage/hello.exe
          WINEDEBUG=-all xvfb-run -a wine stage/hello.exe | tee stage/wine_hello.txt
          grep BSP25D_MINGW_WINE_PASS stage/wine_hello.txt

      - name: Verify D3D12 through Wine vkd3d on Lavapipe
        run: |
          set -euxo pipefail
          source stage/env.sh
          export WINEPREFIX="$PWD/stage/wineprefix"
          rm -rf "$WINEPREFIX"
          WINEDEBUG=-all xvfb-run -a wineboot -u

          # vkd3d-proton's generic setup helper asks Wine to discover system32 via
          # winepath/registry. Portable WoW64 Wine prefixes on headless CI do not
          # always expose that registry value even though drive_c/windows exists.
          # Our test is 64-bit only, so install exactly the same two native DLLs
          # directly and force Wine to load them.
          SYS64="$WINEPREFIX/drive_c/windows/system32"
          mkdir -p "$SYS64"
          test -f "$VKD3D_PROTON_ROOT/x64/d3d12.dll"
          test -f "$VKD3D_PROTON_ROOT/x64/d3d12core.dll"
          cp -f "$VKD3D_PROTON_ROOT/x64/d3d12.dll" "$SYS64/d3d12.dll"
          cp -f "$VKD3D_PROTON_ROOT/x64/d3d12core.dll" "$SYS64/d3d12core.dll"
          export WINEDLLOVERRIDES="d3d12,d3d12core=n,b;mscoree,mshtml="

          cat > /tmp/d3d12_probe.cpp <<'CPP'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <d3d12.h>
          #include <cstdio>
          int main(){
            ID3D12Device* dev=nullptr;
            HRESULT hr=D3D12CreateDevice(nullptr,D3D_FEATURE_LEVEL_11_0,__uuidof(ID3D12Device),(void**)&dev);
            if(FAILED(hr)||!dev){ std::printf("D3D12_FAIL hr=0x%08lx\n",(unsigned long)hr); return 3; }
            D3D12_FEATURE_DATA_D3D12_OPTIONS opts{};
            HRESULT ohr=dev->CheckFeatureSupport(D3D12_FEATURE_D3D12_OPTIONS,&opts,sizeof(opts));
            std::printf("BSP25D_D3D12_WINE_LAVAPIPE_PASS nodes=%u opts_hr=0x%08lx\n",
              (unsigned)dev->GetNodeCount(),(unsigned long)ohr);
            dev->Release(); return 0;
          }
          CPP
          x86_64-w64-mingw32-clang++ -std=c++20 -O2 /tmp/d3d12_probe.cpp -o stage/d3d12_probe.exe -ld3d12 -ldxgi -lole32 -luuid
          WINEDEBUG=-all xvfb-run -a wine stage/d3d12_probe.exe | tee stage/d3d12_probe.txt
          grep BSP25D_D3D12_WINE_LAVAPIPE_PASS stage/d3d12_probe.txt

      - name: Pack offline cache
        run: |
          set -euxo pipefail
          rm -rf stage/wineprefix
          cat > stage/manifest.json <<EOF
          {
            "schema":"bsp25d.offline_toolchain.v1",
            "runner":"ubuntu-24.04",
            "llvm_mingw":"20260616-ucrt",
            "wine":"11.13-staging-amd64-wow64",
            "vkd3d_proton":"3.0.1",
            "dxc":"v1.9.2602.24",
            "lavapipe":"ubuntu-24.04 mesa-vulkan-drivers",
            "validated":{"mingw":true,"wine":true,"lavapipe":true,"d3d12_vkd3d":true}
          }
          EOF
          (cd stage && sha256sum hello.exe d3d12_probe.exe > TOOLCHAIN_PROOFS.sha256)
          tar -cJf bsp25d-offline-toolchain.tar.xz -C stage .
          sha256sum bsp25d-offline-toolchain.tar.xz > bsp25d-offline-toolchain.tar.xz.sha256
          ls -lh bsp25d-offline-toolchain.tar.xz

      - name: Upload offline cache
        uses: actions/upload-artifact@v4
        with:
          name: bsp25d-offline-toolchain-linux-x64
          path: |
            bsp25d-offline-toolchain.tar.xz
            bsp25d-offline-toolchain.tar.xz.sha256
          compression-level: 0
          retention-days: 7
